[package]
name = "dienstag-companion-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gloo-storage = "0.4"
gloo-timers = "0.3"
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement", "Window"] }

